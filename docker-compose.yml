###############################################
# Common Keys for all apps
###############################################

# Project name is pinned so container/volume names never depend on where this
# repo is checked out (the mesh puts it in 3-media/monarch).
name: monarch

x-common-keys: &common-keys
  restart: unless-stopped
  logging:
    driver: json-file
  environment:
    PUID: 1000
    PGID: 1000
    TZ: ${TZ:-America/New_York}
  dns:
    - 1.1.1.1
    - 1.0.0.1

###############################################
# Authentik SSO gateways (oauth2-proxy)
###############################################
# The media apps only ship a local username/password form (no OIDC/SAML), so
# each one is fronted by a real OIDC relying party: oauth2-proxy runs the
# browser through a code flow against Cerulean Authentik and only then proxies
# the app. Every gateway shares one `_innotel_sso` cookie on .innotel.us, so a
# single sign-in covers them all, and the apps' own login is switched off
# (AuthenticationMethod=External), so Authentik is the only door.
#
# There is no nginx auth_request and no Authentik outpost anywhere in the path.
# Endpoints are listed explicitly (no discovery), and the issuer is the
# APP-SCOPED one — see the note beside OAUTH2_PROXY_OIDC_ISSUER_URL below.
#
# The NPM proxy host for each app forwards here instead of to the app: ports
# are on the HOST (NPM runs in its own container and reaches these by IP).
x-sso-env: &sso-env
  OAUTH2_PROXY_PROVIDER: oidc
  OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
  # The App-scoped issuer, trailing slash included — this is the value Authentik
  # puts in the id_token's `iss`. oauth2-proxy verifies `iss` against this even
  # with --skip-oidc-discovery, so pointing it at the bare base makes every
  # callback die with `oidc: id token issued by a different provider` and the
  # browser gets HTTP 500 on /oauth2/callback (reproduced on v7.8.2).
  OAUTH2_PROXY_OIDC_ISSUER_URL: ${MONARCH_SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/${MONARCH_SSO_APP:-monarch-media}/
  OAUTH2_PROXY_LOGIN_URL: ${MONARCH_SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/authorize/
  OAUTH2_PROXY_REDEEM_URL: ${MONARCH_SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/token/
  OAUTH2_PROXY_PROFILE_URL: ${MONARCH_SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/userinfo/
  OAUTH2_PROXY_OIDC_JWKS_URL: ${MONARCH_SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/${MONARCH_SSO_APP:-monarch-media}/jwks/
  OAUTH2_PROXY_CLIENT_ID: ${MONARCH_SSO_CLIENT_ID:-monarch-media}
  OAUTH2_PROXY_CLIENT_SECRET: ${MONARCH_SSO_CLIENT_SECRET:-}
  OAUTH2_PROXY_COOKIE_SECRET: ${SSO_COOKIE_SECRET:-}
  OAUTH2_PROXY_COOKIE_NAME: _innotel_sso
  OAUTH2_PROXY_COOKIE_DOMAINS: ${SSO_COOKIE_DOMAIN:-.innotel.us}
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_COOKIE_SAMESITE: lax
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  # Two flags without which nobody can sign in at all, both measured live on the
  # edge gateway (see npm/docs/stack.md):
  #   * Authentik's DEFAULT `email` scope mapping sets email_verified: false,
  #     and oauth2-proxy refuses such a token -> the callback dies with
  #     "email in id_token (...) isn't verified" (HTTP 500).
  #   * without the groups claim, --allowed-groups restricts nothing, so any
  #     authenticated identity is admitted.
  #
  # The platform standard fixes BOTH at the source: every OAuth2 provider now
  # pins `Innotel OAuth Mapping: OpenID 'email'` (email_verified: true) and the
  # `groups` mapping — see ips/docs/sign-in-posture.md and
  # scripts/authentik-conform-providers.py. The flag below is therefore now a
  # fallback rather than the fix; it stays until every gateway has been
  # recreated against the conformed providers, then it can go.
  OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
  OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
  OAUTH2_PROXY_ALLOWED_GROUPS: ${SSO_REQUIRED_GROUP:-cerulean-platform}
  OAUTH2_PROXY_SCOPE: openid email profile groups
  # Server-side sessions: a cookie session for an identity in thirty groups
  # exceeds 4KB, and the several Set-Cookie headers that follow overflow the
  # edge's proxy_buffer_size -> nginx 502s the callback that would finish the
  # login. The store is shared by every gateway on the platform, so one
  # Authentik sign-in covers all of them.
  OAUTH2_PROXY_SESSION_STORE_TYPE: redis
  OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://:${SSO_SESSION_REDIS_PASSWORD:-}@${SSO_SESSION_REDIS_HOST:-192.168.1.46}:${SSO_SESSION_REDIS_PORT:-16380}/0
  OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
  OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_PASS_USER_HEADERS: "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
  OAUTH2_PROXY_WHITELIST_DOMAINS: ${SSO_COOKIE_DOMAIN:-.innotel.us}

x-sso-gateway: &sso-gateway
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
  restart: unless-stopped
  logging:
    driver: json-file
  networks:
    default:

services:
  ###############################################
  # JELLYFIN - Media Server
  ###############################################
  jellyfin:
    <<: *common-keys
    container_name: jellyfin
    # Pinned to Jellyfin 12.0.0. hotio publishes no version tags for this
    # image (only `latest`/`release`, which track the stable channel and
    # silently rolled 11 -> 12 — that jump crash-looped on migration
    # 20260815063607_RemoveOrphanedUserPermissionsAndPreferences). The digest
    # below is the exact build verified running after the v12 DB repair; set
    # JELLYFIN_IMAGE to move off it deliberately instead of by surprise.
    image: ${JELLYFIN_IMAGE:-ghcr.io/hotio/jellyfin@sha256:6f9599ab620b7c3414a1de42120dc08e7984baeaf6094125ce5c99b39878046a}
    # Memory posture (docs/service-audit.md): transcode bursts are the media
    # stack's biggest consumer; cap and keep swap off.
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      # Host 8097 → container 8096: 8096 on this host belongs to the capstone
      # Control Center (dashboard), so Jellyfin shifts to the next free port.
      #
      # LOOPBACK ONLY. This was `- 8097:8096`, and the edge forwarded both
      # media.innotel.us and media.magnate.innotel.us straight to it — the one
      # public name on this host with no Cerulean gate in front of it. Jellyfin
      # has a login of its own (against the Authentik LDAP directory), which is
      # not the same thing as the platform's single sign-on, and it was the
      # reason a browser could reach a Jellyfin login form without ever passing
      # Authentik. The gateway below is the door now, and it reaches the app by
      # name over the compose network.
      - 127.0.0.1:8097:8096
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/jellyfin:/config
      - /data/media:/data/media:ro

  ###############################################
  # JELLYSEERR - Request Manager
  #
  # Wired to Jellyfin (login + media library) and to
  # Radarr/Sonarr/Lidarr/Whisparr for requests by monarch-init.
  ###############################################
  jellyseerr:
    <<: *common-keys
    container_name: jellyseerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    ports:
      # Loopback only: the <service>-sso gateway reaches the app over the
      # compose network by name, so the LAN must not be a second door.
      - 127.0.0.1:5055:5055
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      PORT: 5055
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/jellyseerr:/app/config

  ###############################################
  # SONARR - TV Shows
  ###############################################
  sonarr:
    <<: *common-keys
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    ports:
      - 127.0.0.1:8989:8989
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/sonarr:/config
      - /data:/data

  ###############################################
  # RADARR - Movies
  ###############################################
  radarr:
    <<: *common-keys
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    ports:
      - 127.0.0.1:7878:7878
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/radarr:/config
      - /data:/data

  ###############################################
  # LIDARR - Music
  ###############################################
  lidarr:
    <<: *common-keys
    container_name: lidarr
    image: ghcr.io/hotio/lidarr:latest
    ports:
      - 127.0.0.1:8686:8686
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/lidarr:/config
      - /data:/data

  ###############################################
  # WHISPARR - Adult
  ###############################################
  whisparr:
    <<: *common-keys
    container_name: whisparr
    # v2-develop (not latest): hotio's `latest` is frozen at v2.2.0-release.231,
    # which predates Whisparr's qBittorrent 5.2.x support (empty 204 login body
    # is treated as a failed auth). v2-develop includes that fix.
    image: ghcr.io/hotio/whisparr:v2-develop
    ports:
      - 127.0.0.1:6969:6969
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/whisparr:/config
      - /data:/data

  ###############################################
  # PROWLARR - Indexer Manager
  # Radarr/Sonarr/Lidarr/Whisparr are registered as
  # "Apps" here and qBittorrent as the download client
  # automatically by monarch-init.
  ###############################################
  prowlarr:
    <<: *common-keys
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    ports:
      - 127.0.0.1:9696:9696
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/prowlarr:/config

  ###############################################
  # BAZARR - Subtitles
  ###############################################
  bazarr:
    <<: *common-keys
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:latest
    ports:
      - 127.0.0.1:6767:6767
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/bazarr:/config
      - /data:/data

  ###############################################
  # HOMARR - Dashboard
  ###############################################
  homarr:
    <<: *common-keys
    container_name: homarr
    # Homarr v1 (homarr-labs rewrite; the old ajnart/homarr v0.16 line is
    # archived). v1 keeps everything under a single /appdata mount.
    image: ghcr.io/homarr-labs/homarr:latest
    ports:
      - 7575:7575
    environment:
      # v1's bundled nginx listens on 7575 and proxies to the app; do NOT set
      # PORT (a v0 holdover) or the Next.js server collides with nginx.
      # Required: secret used to encrypt DB secrets (openssl rand -hex 32).
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY (openssl rand -hex 32)}"
      # Cerulean (Authentik) OIDC SSO — one login for every surface.
      AUTH_PROVIDERS: "oidc"
      AUTH_OIDC_CLIENT_ID: "${AUTH_OIDC_CLIENT_ID:-}"
      AUTH_OIDC_CLIENT_SECRET: "${AUTH_OIDC_CLIENT_SECRET:-}"
      AUTH_OIDC_ISSUER: "${AUTH_OIDC_ISSUER:-}"
      AUTH_OIDC_CLIENT_NAME: "${AUTH_OIDC_CLIENT_NAME:-Cerulean}"
    healthcheck:
      # nginx (v1) listens on 7575 and proxies to the app.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname):7575 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/homarr/appdata:/appdata

  ###############################################
  # QBITTORRENT - Main Downloader (WebUI on :8080)
  #
  # WebUI credentials (MONARCH_USERNAME / MONARCH_PASSWORD)
  # are pre-seeded into its config by monarch-seed BEFORE
  # first start so there is no temporary-password dance.
  ###############################################
  qbittorrent:
    <<: *common-keys
    container_name: qbittorrent
    image: ghcr.io/qbittorrent/docker-qbittorrent-nox:latest
    stop_grace_period: 30m
    depends_on:
      monarch-seed:
        condition: service_completed_successfully
    ports:
      # WebUI is loopback only (the qbittorrent-sso gateway fronts it); the
      # torrenting port must stay reachable, so it is deliberately not bound.
      - 127.0.0.1:8080:8080
      - 6881:6881
      - 6881:6881/udp
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      QBT_LEGAL_NOTICE: confirm
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/qbittorrent:/config
      - /data:/data

  ###############################################
  # SABNZBD - Usenet Downloader
  ###############################################
  sabnzbd:
    <<: *common-keys
    container_name: sabnzbd
    image: ghcr.io/hotio/sabnzbd:latest
    ports:
      # 8082 is the default because scripts/npm-hosts.conf forwards
      # sabnzbd.<domain> to ${SABNZBD_PORT:-8082} - the same variable, so the
      # edge and the publish move together (checked by
      # scripts/check-proxy-ports.py).
      - 127.0.0.1:${SABNZBD_PORT:-8082}:8080
      - 127.0.0.1:9090:9090
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/sabnzbd:/config
      - /data:/data

  ###############################################
  # TRANSMISSION - BitTorrent
  ###############################################
  transmission:
    <<: *common-keys
    container_name: transmission
    image: lscr.io/linuxserver/transmission:latest
    profiles: ["legacy"]
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      USER: ${MONARCH_USERNAME:-admin}
      PASS: ${MONARCH_PASSWORD:-monarch8}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/transmission:/config
      - /data/downloads:/downloads
      - /data/watch:/watch

  ###############################################
  # DELUGE - BitTorrent (WebUI password is set
  # manually on first login with the default 'deluge')
  ###############################################
  deluge:
    <<: *common-keys
    container_name: deluge
    image: lscr.io/linuxserver/deluge:latest
    profiles: ["legacy"]
    ports:
      - 8112:8112
      - 58846:58846
      - 58946:58946
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/deluge:/config
      - /data/downloads:/downloads

  ###############################################
  # REQUESTRR - Discord Bot
  ###############################################
  # LOOPBACK ONLY, and it is the last port on this host that was not. The
  # Discord bot itself is outbound-only, so nothing here breaks by closing the
  # LAN: it is the *config UI* on :4545 that was reachable with its own login,
  # which is the posture every other app on this host gave up (see
  # ips/docs/sign-in-posture.md §5 — this is the second of its two options,
  # taken by way of requestrr-sso below rather than instead of it).
  requestrr:
    <<: *common-keys
    container_name: requestrr
    image: thomst08/requestrr:latest
    ports:
      - 127.0.0.1:4545:4545
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/requestrr:/root/config

  ###############################################
  # FLARESOLVERR - Cloudflare Bypass
  # Registered as an indexer proxy in Prowlarr
  # from Settings > Indexers (manual, one-time).
  ###############################################
  flaresolverr:
    <<: *common-keys
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - 8191:8191
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      LOG_LEVEL: info

  ###############################################
  # AUTOBRR - Indexer Automation
  ###############################################
  autobrr:
    <<: *common-keys
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:latest
    profiles: ["legacy"]
    ports:
      - 7474:7474
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/autobrr:/config

  ###############################################
  # DISPATCHARR - IPTV / Live TV
  ###############################################
  dispatcharr:
    <<: *common-keys
    container_name: dispatcharr
    image: ghcr.io/dispatcharr/dispatcharr:latest
    profiles: ["legacy"]
    ports:
      - 9191:9191
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/dispatcharr:/data

  ###############################################
  # TVHEADEND - IPTV / Live TV
  ###############################################
  tvheadend:
    <<: *common-keys
    container_name: tvheadend
    image: lscr.io/linuxserver/tvheadend:latest
    profiles: ["legacy"]
    ports:
      - 9981:9981
      - 9982:9982
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/tvheadend:/config
      - /data/tv/recordings:/recordings

  ###############################################
  # NEXTPVR - Live TV Backend
  ###############################################
  nextpvr:
    <<: *common-keys
    container_name: nextpvr
    # NextPVR publishes a SEPARATE image per CPU architecture (nextpvr_amd64 /
    # nextpvr_arm64) - there is no multi-arch manifest. install-monarch.sh
    # pins NEXTPVR_IMAGE into .env from `uname -m`; override it manually if
    # you run this stack on the non-native arch.
    image: ${NEXTPVR_IMAGE:-nextpvr/nextpvr_amd64:latest}
    profiles: ["legacy"]
    ports:
      - 8866:8866
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/nextpvr:/config

  ###############################################
  # IPTV - EPG guide generator (Live TV guide)
  # Grabs XMLTV guide data for the channel list in
  # channels.xml (monarch-init writes it on first boot)
  # and serves it at http://iptv:3000/guide.xml.
  # Host port is 3001 so it does not clash with the
  # subscription platform (which owns :3000).
  ###############################################
  iptv:
    <<: *common-keys
    container_name: iptv
    image: ghcr.io/iptv-org/epg:master
    ports:
      # Host 3011 (container 3000): :3001 is the Zeus portal. Loopback only, for
      # the reason on Jellyfin above: the public name is the SSO gateway's, and
      # nothing on the LAN needs a second door to a guide file.
      - 127.0.0.1:3011:3000
    environment:
      # Re-grab the guide twice a day; 8 parallel requests speeds it up.
      CRON_SCHEDULE: "0 0,12 * * *"
      MAX_CONNECTIONS: "8"
      RUN_AT_STARTUP: "true"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Host /opt/epg holds channels.xml (EPG channel list, written by
      # monarch-init) and receives guide.xml (served at http://iptv:3000/guide.xml).
      - /opt/epg:/epg/public

  ###############################################
  # CLIPBUCKET - Video Platform
  ###############################################
  clipbucket:
    <<: *common-keys
    container_name: clipbucket
    # Built from ./clipbucket (nginx + PHP-FPM + MariaDB runtime, app source
    # git-cloned on first boot) - the upstream oxygenz image is amd64-only.
    # The release workflow publishes amd64 + arm64 to GHCR.
    image: ghcr.io/innotelinc/monarch-clipbucket:latest
    build: ./clipbucket
    ports:
      # Loopback only: tube.innotel.us is fronted by clipbucket-sso, which
      # reaches the app by name over the compose network.
      - 127.0.0.1:${CLIPBUCKET_PORT:-8098}:80
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      DOMAIN_NAME: ${CLIPBUCKET_DOMAIN:-tube.innotel.us}
      # The MariaDB runtime's own password, internal to this container — no other
      # service connects to it. It is baked into the `clipbucket_db` volume at
      # first boot, so changing it later means dropping that volume and letting
      # the installer run again, not just editing the value in `.env`.
      MYSQL_PASSWORD: ${CLIPBUCKET_DB_PASSWORD}
      UID: 1000
      GID: 1000
    volumes:
      - clipbucket_db:/var/lib/mysql
      - clipbucket_files:/srv/http/clipbucket

  ###############################################
  # AUTHENTIK - Identity via Cerulean (shared auth & trust stack)
  # Monarch no longer bundles its own Authentik: auth.monarch.innotel.us
  # fronts Cerulean Authentik, and monarch-init provisions the LDAP
  # provider/outpost/bind-user into it with AUTHENTIK_BOOTSTRAP_TOKEN.
  ###############################################
  # AUTHENTIK LDAP OUTPOST - Jellyfin login gate
  # Serves the Cerulean LDAP directory (provider 'jellyfin-ldap') so the
  # Jellyfin LDAP-Auth plugin resolves logins against Authentik users;
  # disabling a user in Cerulean blocks their Jellyfin login.
  # The image tag MUST track the Authentik server version (2026.8.3) -
  # bump both together, and `drift-check` now fails the run when it does not
  # (the Authentik API reports `outpost_outdated`, see docs/operations.md).
  # AUTHENTIK_TOKEN is the outpost API token monarch-init
  # pins in Authentik (AUTHENTIK_LDAP_TOKEN); the bind user the plugin binds
  # with is provisioned by monarch-init too (password = AUTHENTIK_LDAP_BIND_TOKEN).
  authentik-ldap:
    <<: *common-keys
    container_name: authentik-ldap
    image: ghcr.io/goauthentik/ldap:2026.8.3
    environment:
      AUTHENTIK_HOST: ${AUTHENTIK_BASE_URL}
      AUTHENTIK_INSECURE: "true"          # AUTHENTIK_BASE_URL is plain http on the LAN
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_TOKEN:-ak-ldap-outpost-2026}
    depends_on:
      - jellyfin

  ###############################################
  # MONARCH-RECS - AI recommendations + smart search
  # Content-based recommendations over the Jellyfin
  # library (per-user watch history + similar items),
  # with smart search. Optional LLM descriptions via
  # any OpenAI-compatible endpoint when configured
  # (see .env.sample). Internal API on :8002.
  ###############################################
  monarch-recs:
    <<: *common-keys
    container_name: monarch-recs
    image: ghcr.io/innotelinc/monarch-recs:latest
    build: ./ai-recs
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    depends_on:
      jellyfin:
        condition: service_started
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      # Fallback: read the admin token monarch-init exports to
      # /docker/appdata/init/jellyfin-api-key.txt on first boot.
      JELLYFIN_API_KEY_FILE: /docker/appdata/init/jellyfin-api-key.txt
      REFRESH_INTERVAL: 900
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - 8002:8002
    volumes:
      - ./ai-recs:/app
      - /docker/appdata:/docker/appdata:ro

  ###############################################
  # MONARCH-HEALTH - media health analytics
  # Periodically scans the Jellyfin library + media
  # volume and reports: per-library stats, missing/
  # duplicate files, disk usage, most-played items
  # and service health. Internal API on :8003.
  ###############################################
  monarch-health:
    <<: *common-keys
    container_name: monarch-health
    image: ghcr.io/innotelinc/monarch-health:latest
    build: ./health-analytics
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      jellyfin:
        condition: service_started
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_API_KEY_FILE: /docker/appdata/init/jellyfin-api-key.txt
      SCAN_INTERVAL: 3600
      MEDIA_ROOT: /data/media
      REPORT_FILE: /app/data/analytics.json
    ports:
      - 8003:8003
    volumes:
      - ./health-analytics:/app
      - /data/media:/data/media:ro
      - /docker/appdata/monarch-health:/app/data

  ###############################################
  # MONARCH-SEED - Pre-seed qBittorrent WebUI credentials
  # Runs once BEFORE qBittorrent first starts so the
  # WebUI login is MONARCH_USERNAME / MONARCH_PASSWORD from
  # the very first boot (no temporary password).
  ###############################################
  monarch-seed:
    container_name: monarch-seed
    image: python:3.12-slim
    restart: "no"
    environment:
      MONARCH_USERNAME: ${MONARCH_USERNAME:-admin}
      MONARCH_PASSWORD: ${MONARCH_PASSWORD:-monarch8}
    command: ["python", "/init/seed_qbt.py"]
    volumes:
      - ./init:/init:ro
      - /docker/appdata/qbittorrent:/config

  ###############################################
  # MONARCH-INIT - Auto Wire the Whole Stack
  # Runs once after the stack is up and:
  #   * creates the Jellyfin admin user (MONARCH_USERNAME /
  #     MONARCH_PASSWORD), logs in and exports the admin
  #     token to /docker/appdata/init/jellyfin-api-key.txt
  #   * sets forms-auth + shared credentials on every
  #     *arr app, root folders and qBittorrent client
  #   * registers Radarr/Sonarr/Lidarr/Whisparr as
  #     Prowlarr Apps + qBittorrent download client
  #   * creates qBittorrent categories + save paths
  #   * connects Bazarr to Radarr/Sonarr
  #   * wires Jellyseerr to Jellyfin/Radarr/Sonarr
  ###############################################
  monarch-init:
    container_name: monarch-init
    image: python:3.12-slim
    restart: "no"
    depends_on:
      - jellyfin
      - jellyseerr
      - prowlarr
      - sonarr
      - radarr
      - lidarr
      - whisparr
      - bazarr
      - qbittorrent
      - sabnzbd
      - iptv
    environment:
      MONARCH_USERNAME: ${MONARCH_USERNAME:-admin}
      MONARCH_PASSWORD: ${MONARCH_PASSWORD:-monarch8}
      TZ: ${TZ:-America/New_York}
      # Live TV - Jellyfin-native M3U tuner + XMLTV guide. monarch-init adds the
      # tuner/guide to Jellyfin and writes the EPG channel list to /opt/epg.
      LIVETV_M3U_URL: ${LIVETV_M3U_URL:-https://iptv-org.github.io/iptv/countries/us.m3u}
      LIVETV_GUIDE_URL: ${LIVETV_GUIDE_URL:-http://iptv:3000/guide.xml}
      # Authentik connection (LDAP outpost provisioning + Jellyfin LDAP-Auth
      # plugin wiring). Points at the SHARED Authentik bundled with Cerulean
      # (auth.cerulean.innotel.us) — there is ONE identity instance for the
      # whole ecosystem; this stack does not run its own.
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_LDAP_SERVER: ${AUTHENTIK_LDAP_SERVER:-authentik-ldap}
      AUTHENTIK_LDAP_PORT: ${AUTHENTIK_LDAP_PORT:-3389}
      AUTHENTIK_LDAP_BIND_USER: ${AUTHENTIK_LDAP_BIND_USER:-authentik-ldap}
      AUTHENTIK_LDAP_BIND_TOKEN: ${AUTHENTIK_LDAP_BIND_TOKEN:-}
      AUTHENTIK_LDAP_BIND_GROUP: ${AUTHENTIK_LDAP_BIND_GROUP:-paid_users}
      AUTHENTIK_LDAP_ADMIN_GROUP: ${AUTHENTIK_LDAP_ADMIN_GROUP:-jellyfin_admins}
      AUTHENTIK_LDAP_BASE_DN: ${AUTHENTIK_LDAP_BASE_DN:-dc=innotel,dc=us}
      AUTHENTIK_LDAP_TOKEN: ${AUTHENTIK_LDAP_TOKEN:-}
      # Jellyfin's own login page carries a *Cerulean Authentik* button, which
      # needs two things monarch-init writes: the pinned OIDC plugin (see
      # init/jellyfin-plugins.json) and its config. The client id/secret are
      # the same ones the media gateways use — one Authentik application, so a
      # browser signed in by the button is signed in as far as the gateways are
      # concerned, and a native client signing in over LDAP lands on the same
      # account. MONARCH_SSO_SERVER_BASE_URL is the name the plugin builds its
      # redirect_uri from; every public name has that callback registered.
      MONARCH_SSO_AUTHENTIK_BASE: ${MONARCH_SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}
      MONARCH_SSO_APP: ${MONARCH_SSO_APP:-monarch-media}
      MONARCH_SSO_CLIENT_ID: ${MONARCH_SSO_CLIENT_ID:-monarch-media}
      MONARCH_SSO_CLIENT_SECRET: ${MONARCH_SSO_CLIENT_SECRET:-}
      MONARCH_SSO_SERVER_BASE_URL: ${MONARCH_SSO_SERVER_BASE_URL:-https://media.magnate.innotel.us}
      # The Jellyfin/Cerulean account that owns Seerr. Seerr's Owner is
      # `user.id === 1` and nothing else (server/routes/user/index.ts: only row 1
      # may grant admin, and only row 1 may modify row 1), so an install whose
      # first account was the break-glass admin is owned by an account nobody
      # signs in as. monarch-init records this in the invariants manifest;
      # scripts/seerr-owner.py reads it and swaps the two accounts to match.
      MONARCH_SEERR_OWNER: ${MONARCH_SEERR_OWNER:-dhunter}
    command: ["python", "/init/init.py"]
    volumes:
      - ./init:/init:ro
      - /docker/appdata:/docker/appdata
      # lets monarch-init drop /opt/epg/channels.xml for the iptv EPG grabber
      - /opt/epg:/opt/epg

  ###############################################
  # NGINX PROXY MANAGER - Reverse proxy + wildcard SSL
  #
  # Public entry point for the Monarch subdomains.
  # scripts/npm-proxy-hosts.py configures it through
  # its API (login -> wildcard cert via DNS challenge
  # -> proxy hosts). Admin UI on :81 (admin subdomain).
  #
  # HTTPS/HTTP land on 443/80, which take over the
  # host's web ports - see README "Reverse proxy".
  # host.docker.internal is exposed as a fallback
  # forward target (NPM_FORWARD_HOST=host.docker.internal)
  # for reaching host-published ports.
  ###############################################
  nginx-proxy-manager:
    <<: *common-keys
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:latest
    # Optional local reverse proxy: only started when the "npm" compose
    # profile is enabled. Set NPM_MODE=remote in .env to reuse an existing
    # NPM server (NPM_BASE_URL) and keep NPM out of this stack entirely.
    profiles: ["npm"]
    ports:
      # Host 2080/2081/8443: the shared :80/:81/:443 belong to Zeus FreePBX
      # and the external NPM admin — keep this bundled NPM coexistable.
      - 2080:80
      - 8443:443
      - 2081:81
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/nginx-proxy-manager:/data
      - /docker/appdata/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ###############################################
  # WATCHTOWER - Auto Updates
  ###############################################
  watchtower:
    container_name: watchtower
    # containrrr/watchtower is archived (Dec 2025) and its images predate
    # Docker Engine 29's minimum API (1.44) - use the maintained fork.
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command: --cleanup --interval 21600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

###############################################
# Named Volumes
###############################################

  ###############################################
  # SSO gateways — one per app that has no OIDC of its own
  ###############################################
  # Each listens on 4180 inside the stack and is published on a distinct host
  # port; scripts/npm-hosts.conf forwards the matching proxy host at that port.
  radarr-sso:
    <<: *sso-gateway
    container_name: radarr-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://radarr:7878
    ports:
      - "${RADARR_SSO_PORT:-14001}:4180"

  sonarr-sso:
    <<: *sso-gateway
    container_name: sonarr-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://sonarr:8989
    ports:
      - "${SONARR_SSO_PORT:-14002}:4180"

  lidarr-sso:
    <<: *sso-gateway
    container_name: lidarr-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://lidarr:8686
    ports:
      - "${LIDARR_SSO_PORT:-14003}:4180"

  whisparr-sso:
    <<: *sso-gateway
    container_name: whisparr-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://whisparr:6969
    ports:
      - "${WHISPARR_SSO_PORT:-14004}:4180"

  bazarr-sso:
    <<: *sso-gateway
    container_name: bazarr-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://bazarr:6767
    ports:
      - "${BAZARR_SSO_PORT:-14005}:4180"

  prowlarr-sso:
    <<: *sso-gateway
    container_name: prowlarr-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://prowlarr:9696
    ports:
      - "${PROWLARR_SSO_PORT:-14006}:4180"

  qbittorrent-sso:
    <<: *sso-gateway
    container_name: qbittorrent-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://qbittorrent:8080
    ports:
      - "${QBITTORRENT_SSO_PORT:-14007}:4180"

  sabnzbd-sso:
    <<: *sso-gateway
    container_name: sabnzbd-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://sabnzbd:8080
    ports:
      - "${SABNZBD_SSO_PORT:-14008}:4180"

  # ── Published by the proxy, not gated by it (2026-09-18) ──────────────────
  # Seerr keeps no password of its own (`main.localLogin` is off, asserted by
  # scripts/seerr-login-methods.py), so the only credential that opens it is the
  # Jellyfin account — and Jellyfin resolves that against the Authentik LDAP
  # outpost, i.e. it *is* the Cerulean identity. Gating the name as well added a
  # second Authentik pass before a form that then asked for the same identity,
  # and it hid the only sign-in the app has. This proxy therefore still carries
  # the traffic (the app stays bound to loopback, so 14009 is the only door on
  # this host) but no longer demands a session first. Restoring the gate is the
  # single `OAUTH2_PROXY_SKIP_AUTH_ROUTES` line below plus the redirect_uri that
  # is already registered on the provider.
  jellyseerr-sso:
    <<: *sso-gateway
    container_name: jellyseerr-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/.*$"
      OAUTH2_PROXY_UPSTREAMS: http://jellyseerr:5055
    ports:
      - "${JELLYSEERR_SSO_PORT:-14009}:4180"

  ###############################################
  # The names that were still wide open
  ###############################################
  # Added 17 Sep 2026 for the services that had a public name and no relying
  # party in front of it: Jellyfin (media.innotel.us and
  # media.magnate.innotel.us), Clipbucket (tube.innotel.us) and the IPTV guide
  # (tv.monarch.innotel.us). Each app is bound to loopback in this file, so its
  # proxy is not one door among two — it is the only one.
  #
  # Jellyfin asks for its own sign-in afterwards, against the Authentik LDAP
  # directory; that is Jellyfin's user model, not a second platform login.
  #
  # ── The page is published, not gated (2026-09-18) ─────────────────────────
  # Auth is skipped for every path. The API surface (`/Users/…`, `/Items`,
  # `/socket`, `/emby/…`) was already passed through, because native TV and
  # mobile clients speak the Jellyfin API rather than open a sign-in page — and
  # then the *page* was gated, which is the one path those clients cannot take:
  # an Android TV / Fire TV client that opens `…/web/#/login` in a webview gets
  # Authentik's sign-in (or nothing it can render) instead of the Jellyfin form,
  # and Quick Connect has no page to enter its code on. The gateway was asking
  # for a browser OIDC flow from devices that do not have one.
  #
  # What replaces it is not "no authentication": Cerulean Authentik is still the
  # only credential store, by two paths that the app itself drives —
  #
  #   * browsers land on the Jellyfin sign-in page, which carries the OIDC
  #     **Cerulean Authentik** button (Jellyfin.Plugin.OIDC, provider
  #     `authentik`, callback `https://media[.magnate].innotel.us/sso/OIDC/
  #     Callback/authentik` registered on the `monarch-media` provider), and
  #   * native clients use the Authentik LDAP outpost (`jellyfin-ldap`), so the
  #     account they type is their Cerulean identity and disabling it in
  #     Authentik locks them out here too. `scripts/jellyfin-login-methods.py`
  #     is what keeps a Jellyfin-local account from being a way around that.
  #
  # Measured, not assumed: with this rule `/System/Info/Public`,
  # `/Users/AuthenticateByName` (200 + token) and `/QuickConnect/Initiate`
  # answer, and `/web/index.html` serves the Jellyfin SPA instead of a 302 to
  # the IdP. Restoring the gate is the `!=^/(web(/.*)?)?$` form this replaced.
  jellyfin-sso:
    <<: *sso-gateway
    container_name: jellyfin-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/.*$"
      OAUTH2_PROXY_UPSTREAMS: http://jellyfin:8096
    ports:
      - "${JELLYFIN_SSO_PORT:-14010}:4180"

  clipbucket-sso:
    <<: *sso-gateway
    container_name: clipbucket-sso
    environment:
      <<: *sso-env
      OAUTH2_PROXY_UPSTREAMS: http://clipbucket:80
    ports:
      - "${CLIPBUCKET_SSO_PORT:-14011}:4180"

  iptv-sso:
    <<: *sso-gateway
    container_name: iptv-sso
    environment:
      <<: *sso-env
      # guide.xml is fetched by machines as often as by people: the consumers
      # on this compose network address `http://iptv:3000` directly and are
      # unaffected, which is what makes gating the public name safe.
      OAUTH2_PROXY_UPSTREAMS: http://iptv:3000
    ports:
      - "${IPTV_SSO_PORT:-14012}:4180"

  # The Discord bot's admin console, and the last app here without a gate. Its
  # name is inside MONARCH_DOMAIN, so unlike the three above it is a normal
  # `npm-hosts.conf` row (requestrr -> 14013) rather than an edge change.
  requestrr-sso:
    <<: *sso-gateway
    container_name: requestrr-sso
    environment:
      <<: *sso-env
      # Upstream is the app by name over the compose network, which is why the
      # loopback publish above closes nothing the gateway needs. There is no
      # skip-auth route: the bot talks to Discord, not to this port, so no
      # machine consumer of :4545 exists to preserve.
      OAUTH2_PROXY_UPSTREAMS: http://requestrr:4545
    ports:
      - "${REQUESTRR_SSO_PORT:-14013}:4180"

volumes:
  clipbucket_db:
  clipbucket_files:

###############################################
# Monarch Stack Dedicated Network
###############################################

networks:
  default:
    name: monarch_network