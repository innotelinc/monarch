###############################################
# Common Keys for all apps
###############################################

x-common-keys: &common-keys
  restart: unless-stopped
  logging:
    driver: json-file
  environment:
    PUID: 1000
    PGID: 1000
    TZ: ${TZ:-America/New_York}
  dns:
    - 1.1.1.1
    - 1.0.0.1

services:
  ###############################################
  # JELLYFIN - Media Server
  ###############################################
  jellyfin:
    <<: *common-keys
    container_name: jellyfin
    image: ghcr.io/hotio/jellyfin:latest
    ports:
      - 8096:8096
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/jellyfin:/config
      - /data/media:/data/media:ro

  ###############################################
  # JELLYSEERR - Request Manager
  #
  # Wired to Jellyfin (login + media library) and to
  # Radarr/Sonarr/Lidarr/Whisparr for requests by monarch-init.
  ###############################################
  jellyseerr:
    <<: *common-keys
    container_name: jellyseerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    ports:
      - 5055:5055
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      PORT: 5055
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/jellyseerr:/app/config

  ###############################################
  # SONARR - TV Shows
  ###############################################
  sonarr:
    <<: *common-keys
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    ports:
      - 8989:8989
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/sonarr:/config
      - /data:/data

  ###############################################
  # RADARR - Movies
  ###############################################
  radarr:
    <<: *common-keys
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    ports:
      - 7878:7878
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/radarr:/config
      - /data:/data

  ###############################################
  # LIDARR - Music
  ###############################################
  lidarr:
    <<: *common-keys
    container_name: lidarr
    image: ghcr.io/hotio/lidarr:latest
    ports:
      - 8686:8686
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/lidarr:/config
      - /data:/data

  ###############################################
  # WHISPARR - Adult
  ###############################################
  whisparr:
    <<: *common-keys
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:latest
    ports:
      - 6969:6969
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/whisparr:/config
      - /data:/data

  ###############################################
  # PROWLARR - Indexer Manager
  # Radarr/Sonarr/Lidarr/Whisparr are registered as
  # "Apps" here and qBittorrent as the download client
  # automatically by monarch-init.
  ###############################################
  prowlarr:
    <<: *common-keys
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    ports:
      - 9696:9696
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/prowlarr:/config

  ###############################################
  # BAZARR - Subtitles
  ###############################################
  bazarr:
    <<: *common-keys
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:latest
    ports:
      - 6767:6767
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/bazarr:/config
      - /data:/data

  ###############################################
  # HOMARR - Dashboard
  ###############################################
  homarr:
    <<: *common-keys
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    ports:
      - 7575:7575
    # The image's built-in healthcheck probes http://localhost:${PORT}, but the
    # Next.js server binds to the container's own IP (Docker sets HOSTNAME), so
    # localhost is never reachable - override it to probe the container
    # hostname, which resolves to its own IP.
    environment:
      PORT: 7575
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname):$${PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/homarr/configs:/app/data/configs
      - /docker/appdata/homarr/icons:/app/public/icons
      - /docker/appdata/homarr/data:/data

  ###############################################
  # QBITTORRENT - Main Downloader (WebUI on :8080)
  #
  # WebUI credentials (MONARCH_USERNAME / MONARCH_PASSWORD)
  # are pre-seeded into its config by monarch-seed BEFORE
  # first start so there is no temporary-password dance.
  ###############################################
  qbittorrent:
    <<: *common-keys
    container_name: qbittorrent
    image: ghcr.io/qbittorrent/docker-qbittorrent-nox:latest
    stop_grace_period: 30m
    depends_on:
      monarch-seed:
        condition: service_completed_successfully
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      QBT_LEGAL_NOTICE: confirm
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/qbittorrent:/config
      - /data:/data

  ###############################################
  # SABNZBD - Usenet Downloader
  ###############################################
  sabnzbd:
    <<: *common-keys
    container_name: sabnzbd
    image: ghcr.io/hotio/sabnzbd:latest
    ports:
      - ${SABNZBD_PORT:-8081}:8080
      - 9090:9090
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/sabnzbd:/config
      - /data:/data

  ###############################################
  # TRANSMISSION - BitTorrent
  ###############################################
  transmission:
    <<: *common-keys
    container_name: transmission
    image: lscr.io/linuxserver/transmission:latest
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      USER: ${MONARCH_USERNAME:-admin}
      PASS: ${MONARCH_PASSWORD:-monarch8}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/transmission:/config
      - /data/downloads:/downloads
      - /data/watch:/watch

  ###############################################
  # DELUGE - BitTorrent (WebUI password is set
  # manually on first login with the default 'deluge')
  ###############################################
  deluge:
    <<: *common-keys
    container_name: deluge
    image: lscr.io/linuxserver/deluge:latest
    ports:
      - 8112:8112
      - 58846:58846
      - 58946:58946
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/deluge:/config
      - /data/downloads:/downloads

  ###############################################
  # REQUESTRR - Discord Bot
  ###############################################
  requestrr:
    <<: *common-keys
    container_name: requestrr
    image: thomst08/requestrr:latest
    ports:
      - 4545:4545
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/requestrr:/root/config

  ###############################################
  # FLARESOLVERR - Cloudflare Bypass
  # Registered as an indexer proxy in Prowlarr
  # from Settings > Indexers (manual, one-time).
  ###############################################
  flaresolverr:
    <<: *common-keys
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - 8191:8191
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      LOG_LEVEL: info

  ###############################################
  # AUTOBRR - Indexer Automation
  ###############################################
  autobrr:
    <<: *common-keys
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:latest
    ports:
      - 7474:7474
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/autobrr:/config

  ###############################################
  # DISPATCHARR - IPTV / Live TV
  ###############################################
  dispatcharr:
    <<: *common-keys
    container_name: dispatcharr
    image: ghcr.io/dispatcharr/dispatcharr:latest
    ports:
      - 9191:9191
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/dispatcharr:/data

  ###############################################
  # TVHEADEND - IPTV / Live TV
  ###############################################
  tvheadend:
    <<: *common-keys
    container_name: tvheadend
    image: lscr.io/linuxserver/tvheadend:latest
    ports:
      - 9981:9981
      - 9982:9982
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/tvheadend:/config
      - /data/tv/recordings:/recordings

  ###############################################
  # NEXTPVR - Live TV Backend
  ###############################################
  nextpvr:
    <<: *common-keys
    container_name: nextpvr
    image: nextpvr/nextpvr_amd64:latest
    ports:
      - 8866:8866
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/nextpvr:/config

  ###############################################
  # IPTV - EPG guide generator (Live TV guide)
  # Grabs XMLTV guide data for the channel list in
  # channels.xml (monarch-init writes it on first boot)
  # and serves it at http://iptv:3000/guide.xml.
  # Host port is 3001 so it does not clash with the
  # subscription platform (which owns :3000).
  ###############################################
  iptv:
    <<: *common-keys
    container_name: iptv
    image: ghcr.io/iptv-org/epg:master
    ports:
      - 3001:3000
    environment:
      # Re-grab the guide twice a day; 8 parallel requests speeds it up.
      CRON_SCHEDULE: "0 0,12 * * *"
      MAX_CONNECTIONS: "8"
      RUN_AT_STARTUP: "true"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Host /opt/epg holds channels.xml (EPG channel list, written by
      # monarch-init) and receives guide.xml (served at http://iptv:3000/guide.xml).
      - /opt/epg:/epg/public

  ###############################################
  # CLIPBUCKET - Video Platform
  ###############################################
  clipbucket:
    <<: *common-keys
    container_name: clipbucket
    image: oxygenz/clipbucket-v5:latest
    pull_policy: always
    ports:
      - 8088:80
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
      DOMAIN_NAME: tube.innotel.us
      MYSQL_PASSWORD: ClipDB!2026
      UID: 1000
      GID: 1000
    volumes:
      - clipbucket_db:/var/lib/mysql
      - clipbucket_files:/srv/http/clipbucket

  ###############################################
  # AUTHENTIK - Identity Provider
  # SSO + user management. billing-api provisions
  # subscribers into the `paid_users` group; the
  # bootstrap admin uses the shared initial password.
  ###############################################
  authentik-postgresql:
    restart: unless-stopped
    container_name: authentik-postgresql
    image: postgres:17
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: AuthentikDB!2026
    volumes:
      - /docker/appdata/authentik/postgresql:/var/lib/postgresql/data

  # Redis is required by authentik (django cache, sessions, task queue).
  # Without it the server and worker refuse to start - they default to
  # connecting to localhost:6379 inside their own containers.
  authentik-redis:
    restart: unless-stopped
    container_name: authentik-redis
    image: redis:alpine
    command: --save 60 1
    volumes:
      - /docker/appdata/authentik/redis:/data

  authentik-server:
    restart: unless-stopped
    container_name: authentik-server
    image: ghcr.io/goauthentik/server:latest
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ReplaceThisWithALongRandomSecretKey123456
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: AuthentikDB!2026
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      - authentik-postgresql
      - authentik-redis
    ports:
      - 9000:9000
    volumes:
      - /docker/appdata/authentik/media:/media
      - /docker/appdata/authentik/templates:/templates
    # billing-api starts only once Authentik is ready (its /-/health/ready/
    # endpoint returns 200 only after migrations/startup have finished).
    # The authentik image ships neither curl nor wget, so use Python (always
    # present) for the health check - urlopen exits non-zero on a 503 while
    # migrations are still running.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9000/-/health/ready/',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  authentik-worker:
    restart: unless-stopped
    container_name: authentik-worker
    image: ghcr.io/goauthentik/server:latest
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ReplaceThisWithALongRandomSecretKey123456
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: AuthentikDB!2026
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${MONARCH_PASSWORD:-monarch8}
      AUTHENTIK_BOOTSTRAP_TOKEN: ak-bootstrap-innotel-2026
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@innotel.us
    depends_on:
      - authentik-postgresql
      - authentik-redis
    volumes:
      - /docker/appdata/authentik/media:/media
      - /docker/appdata/authentik/templates:/templates

  ###############################################
  # AUTHENTIK LDAP OUTPOST - Jellyfin login gate
  # Serves the LDAP directory the Jellyfin
  # LDAP-Auth plugin authenticates against, so
  # Jellyfin logins resolve against Authentik
  # users directly (disabling a user in
  # Authentik blocks their Jellyfin login).
  #
  # AUTHENTIK_TOKEN is the outpost's API token.
  # billing-api pins it to this exact value via
  # the Authentik API on startup (set_key), so
  # the value here and in billing-api must match.
  ###############################################
  authentik-ldap:
    restart: unless-stopped
    container_name: authentik-ldap
    image: ghcr.io/goauthentik/ldap:latest
    depends_on:
      authentik-server:
        condition: service_healthy
    ports:
      - 389:3389
      - 636:6636
    environment:
      AUTHENTIK_HOST: http://authentik-server:9000
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ak-ldap-outpost-2026

  ###############################################
  # BILLING API - Stripe Webhooks
  # Receives the second Stripe webhook and mirrors
  # payment state into Authentik's `paid_users`
  # group (source code lives in ./billing-api).
  ###############################################
  billing-postgres:
    restart: unless-stopped
    container_name: billing-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: BillingDB!2026
    volumes:
      - /docker/appdata/billing/postgres:/var/lib/postgresql/data

  billing-api:
    restart: unless-stopped
    container_name: billing-api
    image: ghcr.io/innotelinc/monarch-billing-api:latest
    build: ./billing-api
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_live_replace_me}
      # Signing secret for the billing-api webhook endpoint. If unset it falls
      # back to STRIPE_WEBHOOK_SECRET (the platform's endpoint secret).
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
      STRIPE_PRICE_ID: price_replace_me
      BILLING_BASE_URL: https://api.monarch.innotel.us
      BILLING_API_KEY: innotel-billing-api-key
      AUTHENTIK_BASE_URL: http://authentik-server:9000
      AUTHENTIK_BOOTSTRAP_TOKEN: ak-bootstrap-innotel-2026
      AUTHENTIK_DEFAULT_GROUP: paid_users
      # LDAP provisioning - billing-api creates the LDAP provider/outpost and
      # pins these tokens to the values below on startup (see main.py).
      AUTHENTIK_LDAP_TOKEN: ak-ldap-outpost-2026
      AUTHENTIK_LDAP_BIND_TOKEN: ak-ldap-bind-2026
      AUTHENTIK_LDAP_BIND_USER: authentik-ldap
      AUTHENTIK_LDAP_BIND_GROUP: paid_users
      AUTHENTIK_LDAP_ADMIN_GROUP: jellyfin_admins
      AUTHENTIK_LDAP_BASE_DN: dc=innotel,dc=us
      DATABASE_URL: postgresql://billing:BillingDB!2026@billing-postgres:5432/billing
    depends_on:
      billing-postgres:
        condition: service_started
      authentik-server:
        condition: service_healthy
    ports:
      - 8001:8001
    volumes:
      - ./billing-api:/app

  ###############################################
  # MONARCH-RECS - AI recommendations + smart search
  # Content-based recommendations over the Jellyfin
  # library (per-user watch history + similar items),
  # with smart search. Optional LLM descriptions via
  # any OpenAI-compatible endpoint when configured
  # (see .env.sample). Internal API on :8002.
  ###############################################
  monarch-recs:
    <<: *common-keys
    container_name: monarch-recs
    image: ghcr.io/innotelinc/monarch-recs:latest
    build: ./ai-recs
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    depends_on:
      jellyfin:
        condition: service_started
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      # Fallback: read the admin token monarch-init exports to
      # /docker/appdata/init/jellyfin-api-key.txt on first boot.
      JELLYFIN_API_KEY_FILE: /docker/appdata/init/jellyfin-api-key.txt
      REFRESH_INTERVAL: 900
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - 8002:8002
    volumes:
      - ./ai-recs:/app
      - /docker/appdata:/docker/appdata:ro

  ###############################################
  # MONARCH-HEALTH - media health analytics
  # Periodically scans the Jellyfin library + media
  # volume and reports: per-library stats, missing/
  # duplicate files, disk usage, most-played items
  # and service health. Internal API on :8003.
  ###############################################
  monarch-health:
    <<: *common-keys
    container_name: monarch-health
    image: ghcr.io/innotelinc/monarch-health:latest
    build: ./health-analytics
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      jellyfin:
        condition: service_started
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_API_KEY_FILE: /docker/appdata/init/jellyfin-api-key.txt
      SCAN_INTERVAL: 3600
      MEDIA_ROOT: /data/media
      REPORT_FILE: /app/data/analytics.json
    ports:
      - 8003:8003
    volumes:
      - ./health-analytics:/app
      - /data/media:/data/media:ro
      - /docker/appdata/monarch-health:/app/data

  ###############################################
  # JELLYFIN SUBSCRIPTION PLATFORM - Public signup,
  # Stripe billing, Jellyfin account provisioning
  #
  # https://github.com/innotelinc/jellyfin-subscription-platform
  # Served on :3000. Set the env vars in .env - most
  # importantly JELLYFIN_API_KEY (see /docker/appdata/init/
  # after first boot - monarch-init exports the admin token
  # there) and the Stripe keys.
  ###############################################
  jellyfin-subscription:
    container_name: jellyfin-subscription
    image: ghcr.io/innotelinc/jellyfin-subscription-platform:v1.2.0
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      JELLYFIN_URL: ${JELLYFIN_URL:-http://localhost:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      # Authentik - the platform creates/sets the subscriber's password here
      # (same token billing-api uses). The account portal link defaults to
      # AUTHENTIK_BASE_URL/if/user/; set ACCOUNT_PORTAL_URL to override it.
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-http://authentik-server:9000}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-ak-bootstrap-innotel-2026}
      ACCOUNT_PORTAL_URL: ${ACCOUNT_PORTAL_URL:-http://localhost:9000/if/user/}
      REQUEST_URL: ${REQUEST_URL:-http://localhost:5055}
      ADMIN_PASSWORD: ${MONARCH_PASSWORD:-monarch8}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
    volumes:
      - /docker/appdata/jellyfin-subscription:/app/data

  ###############################################
  # MONARCH-SEED - Pre-seed qBittorrent WebUI credentials
  # Runs once BEFORE qBittorrent first starts so the
  # WebUI login is MONARCH_USERNAME / MONARCH_PASSWORD from
  # the very first boot (no temporary password).
  ###############################################
  monarch-seed:
    container_name: monarch-seed
    image: python:3.12-slim
    restart: "no"
    environment:
      MONARCH_USERNAME: ${MONARCH_USERNAME:-admin}
      MONARCH_PASSWORD: ${MONARCH_PASSWORD:-monarch8}
    command: ["python", "/init/seed_qbt.py"]
    volumes:
      - ./init:/init:ro
      - /docker/appdata/qbittorrent:/config

  ###############################################
  # MONARCH-INIT - Auto Wire the Whole Stack
  # Runs once after the stack is up and:
  #   * creates the Jellyfin admin user (MONARCH_USERNAME /
  #     MONARCH_PASSWORD), logs in and exports the admin
  #     token to /docker/appdata/init/jellyfin-api-key.txt
  #   * sets forms-auth + shared credentials on every
  #     *arr app, root folders and qBittorrent client
  #   * registers Radarr/Sonarr/Lidarr/Whisparr as
  #     Prowlarr Apps + qBittorrent download client
  #   * creates qBittorrent categories + save paths
  #   * connects Bazarr to Radarr/Sonarr
  #   * wires Jellyseerr to Jellyfin/Radarr/Sonarr
  ###############################################
  monarch-init:
    container_name: monarch-init
    image: python:3.12-slim
    restart: "no"
    depends_on:
      - jellyfin
      - jellyseerr
      - prowlarr
      - sonarr
      - radarr
      - lidarr
      - whisparr
      - bazarr
      - qbittorrent
      - sabnzbd
      - iptv
    environment:
      MONARCH_USERNAME: ${MONARCH_USERNAME:-admin}
      MONARCH_PASSWORD: ${MONARCH_PASSWORD:-monarch8}
      TZ: ${TZ:-America/New_York}
      # Live TV - Jellyfin-native M3U tuner + XMLTV guide. monarch-init adds the
      # tuner/guide to Jellyfin and writes the EPG channel list to /opt/epg.
      LIVETV_M3U_URL: ${LIVETV_M3U_URL:-https://iptv-org.github.io/iptv/countries/us.m3u}
      LIVETV_GUIDE_URL: ${LIVETV_GUIDE_URL:-http://iptv:3000/guide.xml}
      # Jellyfin LDAP-Auth plugin wiring (values must match billing-api's
      # provisioning - see the README "Authentik LDAP -> Jellyfin" section).
      AUTHENTIK_LDAP_SERVER: authentik-ldap
      AUTHENTIK_LDAP_PORT: 3389
      AUTHENTIK_LDAP_BIND_USER: authentik-ldap
      AUTHENTIK_LDAP_BIND_TOKEN: ak-ldap-bind-2026
      AUTHENTIK_LDAP_BIND_GROUP: paid_users
      AUTHENTIK_LDAP_ADMIN_GROUP: jellyfin_admins
      AUTHENTIK_LDAP_BASE_DN: dc=innotel,dc=us
    command: ["python", "/init/init.py"]
    volumes:
      - ./init:/init:ro
      - /docker/appdata:/docker/appdata
      # lets monarch-init drop /opt/epg/channels.xml for the iptv EPG grabber
      - /opt/epg:/opt/epg

  ###############################################
  # NGINX PROXY MANAGER - Reverse proxy + wildcard SSL
  #
  # Public entry point for the Monarch subdomains.
  # scripts/npm-proxy-hosts.py configures it through
  # its API (login -> wildcard cert via DNS challenge
  # -> proxy hosts). Admin UI on :81 (admin subdomain).
  #
  # HTTPS/HTTP land on 443/80, which take over the
  # host's web ports - see README "Reverse proxy".
  # host.docker.internal is exposed as a fallback
  # forward target (NPM_FORWARD_HOST=host.docker.internal)
  # for reaching host-published ports.
  ###############################################
  nginx-proxy-manager:
    <<: *common-keys
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:latest
    # Optional local reverse proxy: only started when the "npm" compose
    # profile is enabled. Set NPM_MODE=remote in .env to reuse an existing
    # NPM server (NPM_BASE_URL) and keep NPM out of this stack entirely.
    profiles: ["npm"]
    ports:
      - 80:80
      - 443:443
      - 81:81
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/New_York}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/nginx-proxy-manager:/data
      - /docker/appdata/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ###############################################
  # WATCHTOWER - Auto Updates
  ###############################################
  watchtower:
    container_name: watchtower
    # containrrr/watchtower is archived (Dec 2025) and its images predate
    # Docker Engine 29's minimum API (1.44) - use the maintained fork.
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command: --cleanup --interval 21600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

###############################################
# Named Volumes
###############################################

volumes:
  clipbucket_db:
  clipbucket_files:

###############################################
# Monarch Stack Dedicated Network
###############################################

networks:
  default:
    name: monarch_network