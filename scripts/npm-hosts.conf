# ───────────────────────────────────────────────────────────────────────────
# Monarch subdomain -> service map for scripts/npm-proxy-hosts.py
#
# Format (whitespace separated, '#' comments are ignored):
#   <subdomain>  <forward target>  <port>  [websockets]
#
# <subdomain>    - use "@" for the apex: MONARCH_DOMAIN itself. The apex is
#                  the main interface users log into (the Homarr dashboard).
# <forward target>  - container name on the compose network when
#                     NPM_FORWARD_HOST=container (default), or a host name/IP
#                     when NPM_FORWARD_HOST=host.docker.internal.
# <websockets>      - "yes"/"true"/"1" enables websocket upgrade support
#                     (required by Jellyfin, Jellyseerr and Homarr).
#
# The subdomain is prefixed with MONARCH_DOMAIN from .env, e.g. "app" becomes
# app.monarch.innotel.us. Add/remove lines freely - the script reconciles
# against Nginx Proxy Manager on every run (idempotent).
# ───────────────────────────────────────────────────────────────────────────

# @      -> Homarr dashboard (MAIN interface - users log in at MONARCH_DOMAIN)
@        homarr                   7575  yes
# app     -> Homarr dashboard (landing page for the platform)
app      homarr                   7575  yes
# auth    -> Authentik (SSO admin UI + user self-service portal)
auth     authentik-server         9000
# media   -> Jellyfin (streaming - websockets required)
media    jellyfin                 8096  yes
# tv      -> IPTV guide (XMLTV at /guide.xml, consumed by Jellyfin Live TV)
tv       iptv                     3001
# admin   -> Nginx Proxy Manager admin UI
admin    nginx-proxy-manager       81
# (subscribe was the old jellyfin-subscription platform, removed when Magnate
# became the source billing platform for all projects - it has its own domain)
# req     -> Jellyseerr request portal (websockets required)
req      jellyseerr               5055  yes