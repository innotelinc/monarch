# ───────────────────────────────────────────────────────────────────────────
# Monarch subdomain -> service map for scripts/npm-proxy-hosts.py
#
# Format (whitespace separated, '#' comments are ignored):
#   <subdomain>  <forward target>  <port>  [flags...]
#
# <subdomain>    - use "@" for the apex: MONARCH_DOMAIN itself. The apex is
#                  the main interface users log into (the Homarr dashboard).
# <forward target>  - container name on the compose network when
#                     NPM_FORWARD_HOST=container (default), or a host name/IP
#                     when NPM_FORWARD_HOST=host.docker.internal.
# flags             - order-independent, any combination:
#                       yes|true|1  -> enable websocket upgrade support
#                                     (required by Jellyfin, Jellyseerr, Homarr)
#                       fa          -> put Cerulean Authentik SSO in front of
#                                     this host (nginx auth_request against the
#                                     embedded outpost - the media admin apps
#                                     have no OIDC of their own). The Authentik
#                                     half is scripts/authentik-forward-auth.py.
#                                     Disable globally with NPM_FORWARD_AUTH=0,
#                                     or per host with NPM_FORWARD_AUTH_EXCLUDE.
#
# The subdomain is prefixed with MONARCH_DOMAIN from .env, e.g. "app" becomes
# app.monarch.innotel.us. Add/remove lines freely - the script reconciles
# against Nginx Proxy Manager on every run (idempotent).
# ───────────────────────────────────────────────────────────────────────────

# @      -> Homarr dashboard (MAIN interface - users log in at MONARCH_DOMAIN)
@        homarr                   7575  yes
# app     -> Homarr dashboard (landing page for the platform)
app      homarr                   7575  yes
# auth    -> Authentik (SSO admin UI + user self-service portal)
auth     authentik-server         9000
# Jellyfin is published and managed through Magnate at
# https://media.magnate.innotel.us (host 8097 -> container 8096).
# It is intentionally not a Monarch-domain proxy host: it has its own
# Authentik-backed login (LDAP-Auth plugin), so it needs no auth_request gate.
# tv      -> IPTV guide (XMLTV at /guide.xml, consumed by Jellyfin Live TV)
tv       iptv                     3001
# admin   -> Nginx Proxy Manager admin UI
admin    nginx-proxy-manager       81
# (subscribe was the old jellyfin-subscription platform, removed when Magnate
# became the source billing platform for all projects - it has its own domain)
# req     -> Jellyseerr request portal. The SUBSCRIBER-facing URL is
#            https://req.innotel.us (also :5055); this Monarch alias is the
#            internal one, so gating it with SSO does not affect subscribers.
req      jellyseerr               5055  yes fa

# ── Media management apps - Cerulean Authentik SSO in front of the login ──
# These apps only ship a local username/password form (no OIDC/SAML), so the
# `fa` flag is what makes "sign in with Authentik" true for them: Nginx asks
# the Authentik embedded outpost first and only proxies the app on success.
# Ports are the HOST-published ports (NPM runs remote, so it forwards to
# NPM_FORWARD_HOST:<port> rather than to the container).
radarr     radarr                  7878  yes fa
sonarr     sonarr                  8989  yes fa
lidarr     lidarr                  8686  yes fa
whisparr   whisparr                6969  yes fa
bazarr     bazarr                  6767  yes fa
prowlarr   prowlarr                9696  yes fa
# Downloaders have their own WebUI login; SSO-gate them too.
qbittorrent qbittorrent            8080  yes fa
sabnzbd    sabnzbd                 8082  yes fa
