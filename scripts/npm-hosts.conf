# ───────────────────────────────────────────────────────────────────────────
# Monarch subdomain -> service map for scripts/npm-proxy-hosts.py
#
# Format (whitespace separated, '#' comments are ignored):
#   <subdomain>  <forward target>  <port>  [flags...]
#
# <subdomain>    - use "@" for the apex: MONARCH_DOMAIN itself. The apex is
#                  the main interface users log into (the Homarr dashboard).
# <forward target>  - container name on the compose network when
#                     NPM_FORWARD_HOST=container (default), or a host name/IP
#                     when NPM_FORWARD_HOST=host.docker.internal.
# flags             - order-independent, any combination:
#                       yes|true|1  -> enable websocket upgrade support
#                                     (required by Jellyfin, Jellyseerr, Homarr)
#
# There is no gate flag any more. Nothing here writes an nginx auth_request:
# identity is Cerulean Authentik OIDC, reached directly where the app speaks
# OIDC and through an oauth2-proxy SSO gateway where it does not. See the npm
# repo's docs/stack.md.
#
# Ports are this host's PUBLISHED ports (the container port when
# NPM_FORWARD_HOST=container), which is what the remote NPM forwards to. A port
# may be written as ${VAR} / ${VAR:-default} and is then resolved from the
# environment / .env: use the SAME variable and default the compose file uses
# for that publish (sabnzbd below), so one .env value drives both and they
# cannot drift. scripts/check-proxy-ports.py enforces that in CI.
#
# The subdomain is prefixed with MONARCH_DOMAIN from .env, e.g. "app" becomes
# app.monarch.innotel.us. Add/remove lines freely - the script reconciles
# against Nginx Proxy Manager on every run (idempotent).
#
# Removing a line does NOT delete the live proxy host by itself (a typo here
# must never take a host down). The host becomes DRIFT - `--check` fails and
# `drift-check` reports it - and is removed by
# `python3 scripts/npm-proxy-hosts.py --prune`, which only ever touches names
# inside MONARCH_DOMAIN.
# ───────────────────────────────────────────────────────────────────────────

# @      -> Homarr dashboard (MAIN interface - users log in at MONARCH_DOMAIN)
@        homarr                   7575  yes
# app     -> Homarr dashboard (landing page for the platform)
app      homarr                   7575  yes
# auth    -> Authentik (SSO admin UI + user self-service portal)
#
# Explicit upstream, not the global NPM_FORWARD_HOST mode. Authentik is the
# estate's identity provider and runs on the trust host (Cerulean's), which is
# NOT this stack's host — so following the global mode would point a
# monarch-only host at a machine with no Authentik on it, and every sign-in for
# this domain would fail. The variable exists so the address is stated once, in
# .env, alongside the other cross-host references.
auth     ${AUTHENTIK_UPSTREAM_HOST:-192.168.1.46}   9000
# NOT LISTED HERE, AND WHY. Three names forward to an app on this host but are
# not Monarch-domain rows, so adding them would create media.monarch.* and
# tube.monarch.* hosts that should not exist. They are recorded here anyway,
# because this file is where the ports are, and a port that only lives in a live
# NPM database is the drift `--check` cannot see:
#
#   media.innotel.us, media.magnate.innotel.us  ->  jellyfin-sso      14010
#   tube.innotel.us                             ->  clipbucket-sso    14011
#
# All three used to forward to the app's own port (8097, 8098) with no gate at
# all — a Jellyfin login form and a Clipbucket login form reachable from the
# internet without ever passing Authentik. They now point at oauth2-proxy
# gateways on the same host as the app, deployed by docker-compose.yml. The two
# forward_host values live in the edge (Magnate owns the media.* names, the
# archive side owns tube.*), which is why moving them is an edge change and not
# a line in this file.
#
# tv      -> IPTV guide (XMLTV at /guide.xml, consumed by Jellyfin Live TV).
#            Port is HOST 14012, the iptv-sso gateway, not the app's 3011: the
#            guide is public by URL and machine-readable, so it was the last
#            unauthenticated data surface on this host. Consumers on the compose
#            network keep addressing `http://iptv:3000` directly and are
#            unaffected — which is what makes gating the public name safe. (The
#            port was 3011 -> container 3000 rather than 3001 because host :3001
#            belongs to the Zeus portal, so forwarding there served another
#            project's UI under this hostname.)
tv       iptv                     14012
# admin   -> Nginx Proxy Manager admin UI, signed in through the SSO gateway
#            (oauth2-proxy, `cerulean-npm-sso`) — the last surface that used to
#            be reachable with its own login alone.
#
#            The upstream is an EXPLICIT host: 127.0.0.1, port 4180 — the
#            gateway's own loopback inside the NPM container, where nginx runs.
#            It must NOT be NPM_HOST_IP and must NOT be the UI's :81: the
#            gateway is what runs the browser through a real OIDC code flow
#            against Cerulean Authentik, and only afterwards does it proxy to
#            :81, where NPM Edge believes the identity headers the gateway set
#            (see the npm repo's docs/stack.md). Forwarding straight to :81 (or
#            to the LAN IP) skips that flow and the UI answers 403. A dotted/IP
#            forward wins over NPM_FORWARD_HOST (see resolve_forward in
#            npm-proxy-hosts.py), which is how one row points somewhere other
#            than every other row.
#
#            Needs an out-of-band way back in if Authentik is ever down:
#            BREAKGLASS_LOGIN=1 on the NPM host and the LAN admin port (see
#            docs/operations.md).
admin    127.0.0.1               4180
# subscribe -> the shared subscribe portal (ips, nginx on
#              :3040) serving pages/monarch.html by Host header. PUBLIC on
#              purpose: it is a marketing/checkout landing page, not an app
#              surface. Upstream is an explicit host - the shared portal is
#              part of the `ips` project on the trust host, not this stack's
#              (every domain's subscribe.<domain> points at the same :3040), so
#              following the global NPM_FORWARD_HOST mode would send it to a
#              host that does not run it. Port 3040. The old jellyfin-
#              subscription platform this host used to point at was retired
#              when Magnate became the source billing platform for all
#              projects.
subscribe ${SUBSCRIBE_UPSTREAM_HOST:-192.168.1.46}   3040
# req     -> Jellyseerr request portal. The SUBSCRIBER-facing URL is
#            https://req.innotel.us (also :5055); this Monarch alias is the
#            internal one, so gating it with SSO does not affect subscribers.
req        jellyseerr               14009 yes
# ── Media management apps - Authentik SSO in front of the login ──
# These apps ship only a local username/password form (no OIDC/SAML), so each
# one is fronted by an oauth2-proxy SSO gateway that runs the browser through a
# real OIDC code flow against Cerulean Authentik before the app is reachable —
# and the app's own login is switched off, so Authentik is the only door. That
# gateway is deployed with the app on the media host, not by this script; the
# proxy host here points at the gateway's port instead of the app's.
# Ports are the HOST-published ports (NPM runs remote, so it forwards to
# NPM_FORWARD_HOST:<port> rather than to the container).
radarr     radarr                   14001 yes
sonarr     sonarr                   14002 yes
lidarr     lidarr                   14003 yes
whisparr   whisparr                 14004 yes
bazarr     bazarr                   14005 yes
prowlarr   prowlarr                 14006 yes
# Downloaders have their own WebUI login; SSO-gate them too.
qbittorrent qbittorrent              14007 yes
sabnzbd    sabnzbd                  14008 yes
# Requestrr is the Discord bot's admin console, and this row is what makes it
# the last app on this host to stop answering on its own port: the app itself is
# bound to 127.0.0.1 in docker-compose.yml, so the gateway at 14013 is its only
# door. `req` above is a different thing — that is Jellyseerr, the subscriber
# request portal; this is the bot that feeds it from Discord.
requestrr  requestrr                14013 yes
