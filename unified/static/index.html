<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gizmo</title>
  <meta name="description" content="Gizmo — one media platform: library, requests, downloads and live TV in a single place.">
  <meta name="theme-color" content="#0b0d10">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236366f1'/%3E%3Cpath d='M16 46V18l16 14 16-14v28' stroke='%23fff' stroke-width='5' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <aside class="sidebar" aria-label="Primary">
    <a class="brand" href="#/" aria-label="Gizmo home">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-name">Gizmo</span>
    </a>

    <nav class="nav" id="nav">
      <a href="#/" data-view="home"><span aria-hidden="true">◈</span>Home</a>
      <a href="#/library" data-view="library"><span aria-hidden="true">▤</span>Library</a>
      <a href="#/search" data-view="search"><span aria-hidden="true">⌕</span>Search</a>
      <a href="#/requests" data-view="requests"><span aria-hidden="true">＋</span>Requests</a>
      <a href="#/downloads" data-view="downloads"><span aria-hidden="true">↓</span>Downloads</a>
      <a href="#/live" data-view="live"><span aria-hidden="true">◎</span>Live TV</a>
      <a href="#/settings" data-view="settings"><span aria-hidden="true">⚙</span>Settings</a>
    </nav>

    <div class="sidebar-foot">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle colour theme">◐</button>
      <span class="user" id="user">—</span>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Menu" aria-expanded="false">☰</button>
      <form class="searchbar" id="quick-search" role="search">
        <input id="q" type="search" name="q" placeholder="Search your library, or ask the indexers…" autocomplete="off" aria-label="Search">
        <kbd>/</kbd>
      </form>
      <div class="topbar-status" id="status">
        <span class="dot" id="health-dot" aria-hidden="true"></span>
        <span id="health-text">checking…</span>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1">
      <div class="view-loading" id="loading" hidden>
        <div class="skeleton hero-skeleton"></div>
        <div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/" data-view="home">◈<span>Home</span></a>
    <a href="#/library" data-view="library">▤<span>Library</span></a>
    <a href="#/search" data-view="search">⌕<span>Search</span></a>
    <a href="#/downloads" data-view="downloads">↓<span>Queue</span></a>
    <a href="#/settings" data-view="settings">⚙<span>More</span></a>
  </nav>

  <div class="toasts" id="toasts" aria-live="assertive" aria-atomic="false"></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
