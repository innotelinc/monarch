# Comcast Xfinity — Springfield, MA (Pioneer Valley system) channel lineup.
#
# WHAT THIS IS FOR. Jellyfin ingests a flat M3U: thousands of rows in playlist
# order, with no channel numbers, so the guide is a wall of streams and nothing
# lines up with the cable box anyone here already knows. This file is the
# cable-like dial: a channel number per network, plus the category the guide
# groups it under. `scripts/livetv_lineup.py` matches the streams we can actually
# receive against it and numbers them accordingly.
#
# PROVENANCE, because a channel number nobody can trace is a rumour:
#
#   springfield  Comcast's own lineup as filed with the Town of Longmeadow, MA
#                (Feb 2025) — the same franchise that covers Springfield, West
#                Springfield, Chicopee, Holyoke and Agawam. Only the channels
#                quoted in that document are marked `springfield`. Source:
#                https://www.longmeadowma.gov/AgendaCenter/ViewFile/Item/5518?fileID=32486
#   ma-convention  Comcast's Massachusetts numbering from the Cambridge, MA
#                franchise filing (a real Comcast MA system, but a Boston-area
#                one, and older). Numbers here are the convention, not a promise
#                for Springfield — checked 2026-09-19. Source:
#                https://www.cambridgema.gov/news/2011/07/~/media/ebc8d31ebe7f4403ae9e5833f34960d8.ashx
#   fast-only    No cable counterpart exists: the stream is a FAST (ad-supported
#                streaming) service. It gets no cable number and is numbered in
#                its category's band instead, so it never pretends to be a cable
#                channel.
#
# WHY NOT THE EXACT SPRINGFIELD NUMBERS FOR EVERY NETWORK. There is no public
# machine-readable licence for one: xfinity.com/support/local-channel-lineup
# resolves numbers from the service ADDRESS behind a login, and the filed PDFs
# are scans of images (no text layer). So the dial below is exact where a source
# says so and labelled otherwise — replace a `ma-convention` number with the
# real one whenever you can see it in your own lineup, and the playlists follow.
#
# `aliases` are case-insensitive regular expressions matched against the channel
# name in the playlist, most specific first: `\bnbc news\b` must win over
# `\bnbc\b`, or "NBC News NOW" would take the NBC affiliate's number.

system: "Comcast Xfinity — Springfield, MA (Pioneer Valley)"

# The broadcast stations the Springfield system carries, with the numbers the
# filing gives (its "LIMITED BASIC" block). These are the locals a viewer thinks
# of as "channel 3"; they are matched against the stream name the same way.
locals:
  - number: 2
    name: WGBY (PBS)
    category: Local
    source: springfield
    # Strictly the station: a PBS-branded FAST channel ("PBS Nature") is not
    # channel 2, and matching it here would put streaming-only content on the
    # local station's number.
    aliases: ["\\bwgby\\b"]
  - number: 3
    name: WSHM (CBS)
    category: Local
    source: springfield
    aliases: ["\\bwshm\\b"]
  - number: 4
    name: WGGB (ABC)
    category: Local
    source: springfield
    aliases: ["\\bwggb\\b"]
  - number: 5
    name: WWLP (NBC)
    category: Local
    source: springfield
    aliases: ["\\bwwlp\\b"]
  - number: 57
    name: WGBY (PBS) — Springfield
    category: Local
    source: springfield
    aliases: ["\\bwgby 57\\b"]

# Cable networks, in the order a Comcast dial runs: news and information, then
# entertainment, then sports, then the genre services. The category here is what
# the guide groups by, so it overrides the name-based rules in the script.
